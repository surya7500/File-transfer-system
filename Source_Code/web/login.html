<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Nearby Pro · Unlock</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#243d59,#0a1220 65%);font:15px Segoe UI,Arial;color:#f3f7fc}.panel{width:min(420px,100%);padding:30px;border:1px solid #30435b;border-radius:23px;background:#142237;box-shadow:0 24px 80px #0005}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#70e5c4,#83aaff);color:#102033;font-size:25px;font-weight:900}h1{margin:20px 0 5px;font-size:28px}.muted{color:#9aabc0;line-height:1.5}.field{width:100%;padding:14px;margin:22px 0 12px;border-radius:11px;border:1px solid #3a506d;background:#0c1726;color:white;font-size:19px;letter-spacing:2px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#70e5c4;color:#09221e;font-weight:800;font-size:15px;cursor:pointer}.error{color:#ffb7b7;margin:10px 0}
</style></head><body><main class="panel"><div class="logo">↔</div><h1>Welcome to Nearby Pro</h1><p class="muted">Enter the 10-digit PIN shown in the PC app window. Spaces are optional.</p>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}<form method="post" action="/login"><input class="field" type="password" name="pin" inputmode="numeric" pattern="[0-9 -]{10,12}" maxlength="12" autocomplete="off" placeholder="10-digit PIN" required autofocus><button class="btn">Unlock file sharing</button></form></main></body></html>
